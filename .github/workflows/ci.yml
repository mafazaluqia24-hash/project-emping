name: CI
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: "pdo_mysql, curl" }
      - name: php -l semua berkas PHP
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: node --check main.js
        run: node --check public/js/main.js
  smoke:
    runs-on: ubuntu-latest
    needs: lint
    services:
      mysql:
        image: mysql:8.0
        env: { MYSQL_ALLOW_EMPTY_PASSWORD: 'yes' }
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      EMPING_DB_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: "pdo_mysql, curl" }
      - name: Impor skema
        run: mysql -h 127.0.0.1 -u root < schema.sql
      - name: Siapkan config
        run: cp config/config.sample.php config/config.php
      - name: Jalankan server & smoke test
        run: |
          php -S 127.0.0.1:8080 -t . >/tmp/server.log 2>&1 &
          sleep 2
          php tests/api_smoke.php http://127.0.0.1:8080
